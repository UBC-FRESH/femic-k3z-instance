[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femic-k3z-instance"
version = "0.1.0"
description = "K3Z-owned FEMIC instance bindings and policy adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pandas",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.entry-points."femic.fmg_bundle_auxiliary"]
k3z = "k3z_femic.fmg:provider_factory"

[project.entry-points."femic.patchworks_variant_registries"]
k3z = "k3z_femic.patchworks_variants:provider_factory"

[project.entry-points."femic.instance_catalogs"]
k3z = "k3z_femic.instance_catalog:provider_factory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k3z_femic = ["resources/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
